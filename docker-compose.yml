services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: shelly-exporter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shelly_exporter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shelly_exporter"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: shelly-exporter-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shelly_exporter
      # DISABLE_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  timescaledb_data:
